[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spintronics-sim"
version = "0.1.0"
authors = [{name = "11-qlab"}]
description = "Spintronics simulator: STT-MTJ switching via Landau-Lifshitz-Gilbert"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["spintronics", "MTJ", "STT", "MRAM", "LLG"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy", "scipy", "matplotlib"]

[project.urls]
Homepage = "https://github.com/11-qlab/spintronics-sim"

[project.scripts]
spintronics-sim = "spintronics_sim.cli:main"
